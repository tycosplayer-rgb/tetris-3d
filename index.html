<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>3D Tetris</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Lines</span>
          <span id="lines">0</span>
        </div>
        <div class="stat">
          <span class="label">Level</span>
          <span id="level">1</span>
        </div>
        <div class="stat next-wrap">
          <span class="label">Next</span>
          <span id="next-label">—</span>
        </div>
      </header>

      <canvas id="game-canvas"></canvas>

      <div id="hints">
        <span>Swipe = move</span>
        <span>Tap = rotate</span>
        <span>Swipe ↓ = hard drop</span>
      </div>

      <div id="controls">
        <button type="button" id="btn-soft" aria-label="Soft drop">↓ Soft</button>
        <button type="button" id="btn-hard" aria-label="Hard drop">⬇ Hard</button>
        <button type="button" id="btn-pause" aria-label="Pause">Pause</button>
        <button type="button" id="btn-restart" aria-label="Restart">Restart</button>
      </div>

      <div id="overlay" class="hidden">
        <div class="panel">
          <h1 id="overlay-title">3D Tetris</h1>
          <p id="overlay-msg">Swipe to move · Tap to rotate · Swipe ↓ hard drop</p>
          <button type="button" id="btn-start">Start</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
